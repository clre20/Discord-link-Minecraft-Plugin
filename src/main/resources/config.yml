# DiscordLink 設定檔
# 顯示文字都在 messages.yml
config-version: 2

# 訊息前綴（MiniMessage 或 & 顏色碼）
prefix: "<aqua>[DiscordLink]</aqua> "

database:
  # SQLite 檔名（放在插件資料夾，只能用英數字、. _ -）
  sqlite-file-name: "database.db"

discord:
  # 機器人 Token
  token: "YOUR_DISCORD_BOT_TOKEN"
  # 驗證頻道 ID（玩家在這裡輸入代碼）
  verify-channel-id: "YOUR_CHANNEL_ID"
  # 綁定成功後私訊玩家
  private-message: true
  admin-log:
    enabled: true
    # 管理員日誌頻道 ID
    channel-id: "YOUR_ADMIN_LOG_CHANNEL_ID"

verification:
  # true：未綁定不能進服；false：可以進服，用 /dclink link 綁定
  force-binding: true
  # 每個 Discord 帳號最多綁定幾個 Minecraft 帳號
  max-bindings-per-discord: 1
  # 代碼有效時間（分鐘）
  code-expiry-minutes: 5
  # 同一個 Discord 帳號輸錯代碼的次數上限，超過後暫停接受（防止亂猜代碼）
  max-failed-attempts: 5
  # 暫停時間（分鐘），從第一次輸錯開始算
  attempt-window-minutes: 10

# HTTP API（經 HttpHub 提供，網址：http://<IP>:<HttpHub 端口>/discordlink/api/query）
# 需要安裝 HttpHub：https://github.com/clre20/HttpHub
api:
  enabled: true
  # GENERATE = 第一次啟動時自動產生 64 字元金鑰並寫回這裡
  key: "GENERATE"
  # 允許用網址參數 ?key= 傳金鑰（會出現在網址與記錄中，建議改用 Authorization 標頭後關掉）
  allow-query-key: true

update-checker:
  # 啟動時檢查 GitHub 新版本（結果寫在後台）
  check-on-startup: true
  # 有新版時，有 discordlink.version 權限的玩家登入 3 秒後收到提醒
  notify-on-join: true
